server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3308/bioplatform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: REDACTED_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: host.docker.internal
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

jwt:
  secret: "YmlvcGxhdEZvcm0tZGV2LXNlY3JldC1rZXktZm9yLWp3dC0yMDI0LWF0LWxlYXN0LTMyLWNoYXJz"
  access-token-expiry-ms: 3600000
  refresh-token-expiry-ms: 1209600000

security:
  jwt:
    whitelist:
      - /api/front/**
      - /api/admin/auth/login
      - /api/admin/auth/refreshToken
      - /api/admin/users/register
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html

bioplatform:
  storage:
    type: shared
    shared-path: /app/uploads
  workers:
    urls: []

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bioplatform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

knife4j:
  enable: true

logging:
  level:
    com.bioplatform: INFO
    com.bioplatform.mapper: INFO
