server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3308/bioplatform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: REDACTED_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      connection-test-query: SELECT 1
  data:
    redis:
      host: blog_redis
      port: 6379
      password: "REDACTED_REDIS_PASSWORD"
      database: 0
      timeout: 3000ms
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  mail:
    host: smtpdm.aliyun.com
    port: 465
    username: bio@mail.shiganluo.top
    password: REDACTED_SMTP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

jwt:
  secret: "REDACTED_JWT_SECRET"
  access-token-expiry-ms: 3600000
  refresh-token-expiry-ms: 604800000

security:
  jwt:
    whitelist:
      - /api/front/auth/login
      - /api/front/auth/register
      - /api/front/auth/sendEmailCode
      - /api/front/projects/**
      - /api/front/pipelines/**
      - /api/front/site-config
      - /api/admin/auth/login
      - /api/admin/auth/refreshToken
      - /api/admin/users/register
      - /api/admin/util/get-captcha
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /favicon.ico
      - /ws/**
    tokenHeader: Authorization
    tokenHead: "Bearer "
    secret: "REDACTED_JWT_SECRET"
    accessTokenExpiration: 3600000
    refreshTokenExpiration: 604800000

bioplatform:
  storage:
    type: shared
    shared-path: /app/uploads
  workers:
    urls: []

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bioplatform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

knife4j:
  enable: true

logging:
  level:
    com.bioplatform: INFO
    com.bioplatform.mapper: INFO
