# 生产环境配置
server:
  port: 8080
  tomcat:
    max-threads: 200  # 最大工作线程数
    min-spare-threads: 20  # 最小空闲线程数
    max-connections: 8192  # 最大连接数
    accept-count: 100  # 等待队列长度
    connection-timeout: 20000  # 连接超时时间（毫秒）

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/bioplatform?useSSL=true&requireSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
    username: bioplatform  # 生产环境专用账号，不使用root
    password: ${DB_PASSWORD:changeme}  # 从环境变量读取密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20  # 最大连接数
      minimum-idle: 5  # 最小空闲连接
      idle-timeout: 600000  # 空闲连接超时（10分钟）
      max-lifetime: 1200000  # 连接最大存活时间（20分钟，必须比MySQL wait_timeout 1800s至少短30s）
      connection-timeout: 30000  # 获取连接超时（30秒）
      validation-timeout: 5000
      connection-test-query: SELECT 1
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:changeme}  # 从环境变量读取密码
      timeout: 3000ms
      database: 0
      lettuce:
        pool:
          max-active: 16  # 最大活跃连接
          max-idle: 8  # 最大空闲连接
          min-idle: 2  # 最小空闲连接
          max-wait: 3000ms  # 获取连接最大等待时间
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB  # 生产环境允许更大文件
      max-request-size: 200MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

## JWT配置（生产环境使用更强的密钥）
security:
  jwt:
    whitelist:
      - /api/front/**
      - /api/admin/users/login
      - /api/admin/users/refreshToken
      - /api/admin/util/get-captcha
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /favicon.ico
      - /ws/**
    tokenHeader: Authorization
    tokenHead: "Bearer "
    secret: ${JWT_SECRET:please-change-this-secret-key-in-production-at-least-32-chars}
    accessTokenExpiration: 3600000  # 1小时
    refreshTokenExpiration: 604800000  # 7天（生产环境缩短Refresh Token有效期）

## 文件上传配置
app:
  upload:
    dir: /data/bioplatform/uploads
    ipPrefix: https://bioplatform.your-domain.com
  bio-data:
    fasta-dir: /data/bioplatform/fasta
    vcf-dir: /data/bioplatform/vcf
    bam-dir: /data/bioplatform/bam
    result-dir: /data/bioplatform/results

## LLM配置（生产环境）
llm:
  enabled: ${LLM_ENABLED:false}
  provider: ${LLM_PROVIDER:openai}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4}
  max-tokens: 4096
  temperature: 0.7
  timeout: 60000

## Knife4j关闭生产环境API文档
knife4j:
  enable: false

## 生产环境日志配置
logging:
  level:
    root: WARN
    com.bioplatform: INFO
    com.bioplatform.mapper: INFO  # 生产环境不输出SQL日志
    org.springframework: WARN
