# ============================================================
# 生物信息学云平台 - Docker 环境配置文件
# 用于 Docker Compose 部署时的 Spring Boot 配置
# 激活方式：SPRING_PROFILES_ACTIVE=docker
# 说明：所有敏感信息通过环境变量注入，不硬编码在配置文件中
# ============================================================

server:
  port: 8080
  tomcat:
    max-threads: 200          # 最大工作线程数
    min-spare-threads: 20     # 最小空闲线程数
    max-connections: 8192     # 最大连接数
    accept-count: 100         # 等待队列长度
    connection-timeout: 20000 # 连接超时时间（毫秒）

spring:
  datasource:
    # Docker 网络中 MySQL 服务名为 "mysql"，端口 3306（容器内部端口）
    # 从环境变量 DB_PASSWORD 读取数据库密码
    url: jdbc:mysql://mysql:3306/bioplatform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
    username: root
    password: ${DB_PASSWORD:bioplatform123}  # 从环境变量读取密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（Spring Boot 默认连接池）
    hikari:
      maximum-pool-size: 20      # 最大连接数
      minimum-idle: 5            # 最小空闲连接
      idle-timeout: 600000       # 空闲连接超时（10分钟）
      max-lifetime: 1200000      # 连接最大存活时间（20分钟，必须比MySQL wait_timeout 1800s至少短30s）
      connection-timeout: 30000  # 获取连接超时（30秒）
      validation-timeout: 5000   # 连接验证超时（5秒）
      connection-test-query: SELECT 1  # 连接验证查询
      pool-name: BioplatformHikariPool

  data:
    redis:
      # Docker 网络中 Redis 服务名为 "redis"，端口 6379（容器内部端口）
      host: redis
      port: 6379
      password: ""               # Docker 内部网络无需密码
      timeout: 3000ms
      database: 0
      # Lettuce 连接池配置
      lettuce:
        pool:
          max-active: 16     # 最大活跃连接
          max-idle: 8        # 最大空闲连接
          min-idle: 2        # 最小空闲连接
          max-wait: 3000ms   # 获取连接最大等待时间

  servlet:
    multipart:
      enabled: true             # 开启文件上传
      max-file-size: 100MB      # 单个文件最大大小
      max-request-size: 200MB   # 单次请求最大大小

  # Jackson 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss  # 日期格式化
    time-zone: Asia/Shanghai           # 时区设置
    default-property-inclusion: non_null  # 忽略null字段
    serialization:
      write-dates-as-timestamps: false  # 日期不输出时间戳

## JWT配置（Docker 环境使用更强的密钥）
security:
  jwt:
    whitelist:
      # 公开接口白名单（无需认证）
      - /api/front/**
      - /api/admin/auth/login
      - /api/admin/auth/refreshToken
      - /api/admin/users/register
      - /api/admin/util/get-captcha
      # API文档
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      - /favicon.ico
      # WebSocket
      - /ws/**
    tokenHeader: Authorization   # JWT存储的请求头
    tokenHead: "Bearer "         # 令牌前缀
    secret: ${JWT_SECRET:REDACTED_DOCKER_JWT_SECRET}
    accessTokenExpiration: 3600000     # Access Token过期时间：1小时（毫秒）
    refreshTokenExpiration: 604800000  # Refresh Token过期时间：7天（毫秒）

## JWT密钥配置（JwtTokenProviderUtil使用）
jwt:
  secret: ${JWT_SECRET:REDACTED_DOCKER_JWT_SECRET}
  access-token-expiry-ms: 3600000      # Access Token过期时间：1小时
  refresh-token-expiry-ms: 604800000   # Refresh Token过期时间：7天

## 文件上传配置（Docker 容器内路径）
app:
  upload:
    dir: /data/bioplatform/uploads       # 文件存储根目录（Docker卷映射）
    ipPrefix: http://localhost:8080      # 文件访问URL前缀
  # 生物信息学数据文件配置
  bio-data:
    fasta-dir: /data/bioplatform/fasta   # FASTA文件目录
    vcf-dir: /data/bioplatform/vcf       # VCF文件目录
    bam-dir: /data/bioplatform/bam       # BAM文件目录
    result-dir: /data/bioplatform/results # 分析结果目录

## LLM大模型配置（占位，后续接入时填入实际配置）
llm:
  enabled: ${LLM_ENABLED:false}          # 是否启用LLM功能
  provider: ${LLM_PROVIDER:openai}       # 模型提供商
  api-key: ${LLM_API_KEY:}               # API密钥
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-4}             # 默认使用的模型
  max-tokens: 4096
  temperature: 0.7
  timeout: 60000

## Knife4j 关闭生产环境API文档
knife4j:
  enable: false  # Docker生产环境不开启API文档

## MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bioplatform.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

## PageHelper分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: true

## Docker 环境日志配置（生产级别）
logging:
  level:
    root: WARN
    com.bioplatform: INFO           # 应用日志级别
    com.bioplatform.mapper: INFO    # SQL日志（生产环境不输出DEBUG）
    org.springframework: WARN
    org.apache.ibatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
