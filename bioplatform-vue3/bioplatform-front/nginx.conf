# ============================================================
# 生物信息学云平台 - 公开前端 Nginx 配置
# 功能：
#   1. 提供 Vue3 SPA 静态文件服务（面向普通用户）
#   2. 反向代理 /api 请求到 Spring Boot 后端
#   3. WebSocket 代理支持实时通信
# ============================================================

server {
    # 监听 80 端口（HTTP）
    listen 80;
    server_name localhost;

    # ---------- 基本设置 ----------
    # 客户端请求体最大大小（与后端文件上传限制一致）
    client_max_body_size 200m;

    # ---------- 静态文件服务 ----------
    # Vue3 SPA 根目录（公开用户前端）
    root /usr/share/nginx/html;
    index index.html;

    # ---------- API 反向代理 ----------
    # 将 /api 前缀的请求代理到 Spring Boot 后端服务
    # 公开前端使用 /api/front/** 路径访问公开API
    location /api/ {
        # 代理目标地址（后端服务地址）
        proxy_pass http://backend:8080;

        # 代理请求头设置
        proxy_set_header Host $host;                # 保留原始主机名
        proxy_set_header X-Real-IP $remote_addr;    # 客户端真实IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 代理链IP
        proxy_set_header X-Forwarded-Proto $scheme; # 原始协议（http/https）

        # 超时设置
        proxy_connect_timeout 60s;    # 连接后端超时
        proxy_send_timeout 300s;      # 发送请求超时（SSE长连接需要更长）
        proxy_read_timeout 300s;      # 读取响应超时（SSE/工具调用可能耗时较长）

        # 缓冲设置（SSE 流式响应必须关闭缓冲，否则事件被积压无法实时推送）
        proxy_buffering off;
    }

    # ---------- WebSocket 代理 ----------
    # 支持前端与后端的 WebSocket 实时通信（如任务状态推送）
    location /ws/ {
        # WebSocket 代理目标
        proxy_pass http://backend:8080;

        # WebSocket 必需的升级头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（设置较长）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Vue3 SPA 路由支持 ----------
    # 所有非文件请求都返回 index.html，由 Vue Router 处理前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源缓存 ----------
    # JS、CSS 等静态资源设置较长缓存（Vite 构建带哈希值）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;           # 缓存30天
        add_header Cache-Control "public, immutable";  # 告诉浏览器可强缓存
        access_log off;        # 静态资源不记录访问日志
    }

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;  # 小于1KB的文件不压缩

    # ---------- 错误页面 ----------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
