# 全局日志
# [2026-10-29] blog/back/minio 亦已迁移至 lv_zheda: 经 frps 容器隧道(17003-17005)转发,
# 阿里云仅保留 nginx-proxy 公网入口 + blog_mysql(回滚用)。
# [2026-10-29] bio/bioadmin 已迁移至内网 lv_zheda: 经 frps 容器(blog_net, 17001/17002 未对外发布)转发;
# $bio_* 变量指向 frps 容器名, 容器网络内可达, 公网不可达。
# Docker 内置 DNS，动态解析容器名（避免容器重启后 IP 变化导致 502）
resolver 127.0.0.11 valid=10s ipv6=off;

access_log /var/log/nginx/access.log;
error_log  /var/log/nginx/error.log;

# HTTP 强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name blog.shiganluo.top back.shiganluo.top minio.shiganluo.top bio.shiganluo.top bioadmin.shiganluo.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 博客前台
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.shiganluo.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/shiganluo.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        set $blog_web frps:17003;
        proxy_pass http://$blog_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 博客后台
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name back.shiganluo.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/shiganluo.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 50m;

    location / {
        set $blog_admin frps:17004;
        proxy_pass http://$blog_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}

# MinIO
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name minio.shiganluo.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/shiganluo.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 0;

    location / {
        set $minio frps:17005;
        proxy_pass http://$minio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

# ========== BioPlatform ==========

# BioPlatform 前台
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bio.shiganluo.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/shiganluo.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 500m;

    location / {
        set $bio_front frps:17001;
        proxy_pass http://$bio_front;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $bio_backend frps:17001;
        proxy_pass http://$bio_backend;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ws/ {
        set $bio_ws frps:17001;
        proxy_pass http://$bio_ws;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}

