# BioPlatform 远程部署编排
# 与博客项目共用 MySQL/Redis，加入 blog_net 网络
# 用法: docker-compose -f docker-compose-remote.yml up -d

services:
  # 后端
  backend:
    image: bioplatform-backend
    container_name: bioplatform-backend
    restart: always
    ports:
      - "8083:8080"
    cap_add:
      - SYS_CHROOT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://blog_mysql:3306/bioplatform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: blog_redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BIOPLATFORM_AES_KEY: ${BIOPLATFORM_AES_KEY}
      BIOPLATFORM_STORAGE_SHARED_PATH: /app/uploads   # 共享存储根指向持久卷（分片/普通上传统一落这里）
      BIPLATFORM_STORAGE_DATAROOT: ${STORAGE_DATA_ROOT}   # 上传卷宿主机路径,任务命令 docker run -v 挂载用
      WORKER_TOKEN: ${WORKER_TOKEN}   # 计算节点(bio_worker)端点鉴权
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=256m -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=128m -XX:-TieredCompilation -Djava.security.egd=file:/dev/./urandom"
      TZ: Asia/Shanghai
    volumes:
      - bioplatform-uploads:/app/uploads
      - /:/host:ro
    networks:
      - blog_net

  # 前台
  front:
    image: bioplatform-front
    container_name: bioplatform-front
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - blog_net

  # 后台管理
  admin:
    image: bioplatform-admin
    container_name: bioplatform-admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - blog_net

  # 计算节点(方案B):执行渲染后的任务命令
  # 挂 docker.sock(DooD,任务内 docker run 走宿主机守护进程)+ uploads 卷(读输入写结果)
  # 不发布端口,仅 blog_net 内可达;端点鉴权走 WORKER_TOKEN
  worker:
    image: bioplatform-worker
    container_name: bio_worker
    restart: always
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN}
      TASK_DIR: /data/tasks
    volumes:
      - bioplatform-uploads:/app/uploads
      - bio-worker-tasks:/data/tasks
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      blog_net:
        # 别名必须用连字符:java.net.URI 对含下划线的主机名返回 host=null,
        # java.net.http 报 "unsupported URI"(2026-10-31 实测踩坑)
        aliases:
          - bio-worker

networks:
  blog_net:
    external: true

volumes:
  bioplatform-uploads:
    name: bioplatform-uploads
  bio-worker-tasks:
    name: bio-worker-tasks
