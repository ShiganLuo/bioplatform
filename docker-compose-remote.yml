# BioPlatform 远程部署编排
# 与博客项目共用 MySQL/Redis，加入 blog_net 网络
# 用法: docker compose -f docker-compose-remote.yml up -d

services:
  # 后端
  backend:
    image: bioplatform-backend
    container_name: bioplatform-backend
    restart: always
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://blog_mysql:3306/bioplatform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: REDACTED_DB_PASSWORD
      TZ: Asia/Shanghai
    volumes:
      - bioplatform-uploads:/app/uploads
    networks:
      - blog_net

  # 前台
  front:
    image: bioplatform-front
    container_name: bioplatform-front
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - blog_net

  # 后台管理
  admin:
    image: bioplatform-admin
    container_name: bioplatform-admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - blog_net

networks:
  blog_net:
    external: true

volumes:
  bioplatform-uploads:
    name: bioplatform-uploads
