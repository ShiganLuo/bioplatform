# BioPlatform 远程部署编排
# 与博客项目共用 MySQL/Redis，加入 blog_net 网络
# 用法: docker-compose -f docker-compose-remote.yml up -d

services:
  # 后端
  backend:
    image: bioplatform-backend
    container_name: bioplatform-backend
    restart: always
    ports:
      - "8083:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://blog_mysql:3306/bioplatform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: blog_redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BIOPLATFORM_AES_KEY: ${BIOPLATFORM_AES_KEY}
      BIOPLATFORM_STORAGE_SHARED_PATH: /app/uploads   # 共享存储根指向持久卷（分片/普通上传统一落这里）
      BIPLATFORM_STORAGE_DATAROOT: ${STORAGE_DATA_ROOT}   # 上传卷宿主机路径,任务命令 docker run -v 挂载用
      WORKER_TOKEN: ${WORKER_TOKEN}   # 计算节点(bio_worker)端点鉴权
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:MetaspaceSize=128m -XX:MaxMetaspaceSize=256m -XX:+UseStringDeduplication -XX:ReservedCodeCacheSize=128m -XX:-TieredCompilation -Djava.security.egd=file:/dev/./urandom"
      TZ: Asia/Shanghai
    volumes:
      - bioplatform-uploads:/app/uploads
      # [安全收窄 2026-11-24] 不再整盘只读挂 /:/host:ro（整机可读=入侵后主要泄密面）。
      # 只挂数据盘：输出根/Omics 仓库/交付数据都在 /data/16T 下；
      # "导入服务器任意路径"降级为 /data/16T/**；宿主机命令执行改经计算节点（不再 chroot）。
      - /data/16T:/host/data/16T:ro
    networks:
      - blog_net

  # 前台
  front:
    image: bioplatform-front
    container_name: bioplatform-front
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - blog_net

  # 后台管理
  admin:
    image: bioplatform-admin
    container_name: bioplatform-admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - blog_net

  # 计算节点(方案B):执行渲染后的任务命令
  # 挂 docker.sock(DooD,任务内 docker run 走宿主机守护进程)+ uploads 卷(读输入写结果)
  # 不发布端口,仅 blog_net 内可达;端点鉴权走 WORKER_TOKEN
  worker:
    image: bioplatform-worker
    container_name: bio_worker
    restart: always
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN}
      TASK_DIR: /data/tasks
    volumes:
      - bioplatform-uploads:/app/uploads
      - bio-worker-tasks:/data/tasks
      # [2026-11-24 二期] docker.sock 挂载已摘:任务/shell 命令经 nsenter 在宿主机
      # 命名空间执行,用的是宿主机自己的 socket,容器内挂载从未参与——纯冗余暴露面。
      # docker-socket-proxy 方案对该架构无效(nsenter 路径绕过任何容器侧代理),不采纳。
      # [2026-11-24 方案C] /:/host 整盘挂载已摘除:chroot /host 时代遗留,nsenter 路径
      # 进宿主机挂载命名空间不经容器挂载(冗余);消费点已改 /proc/1/root 探测
    # apptainer 建 user namespace 需要 CAP_SYS_ADMIN(Ubuntu apparmor 限制 + docker 默认能力集无此 cap),
    # 直接 privileged(本 worker 已挂 docker.sock,信任边界不变;宿主机 userns/sif 均正常)
    privileged: true
    # 与宿主机共享 PID 命名空间:执行命令经 nsenter -t 1 进宿主机 mount/uts/ipc/pid 空间运行
    # (apptainer 的 newuidmap 流程只在宿主机命名空间下可用)
    pid: host
    networks:
      blog_net:
        # 别名必须用连字符:java.net.URI 对含下划线的主机名返回 host=null,
        # java.net.http 报 "unsupported URI"(2026-10-31 实测踩坑)
        aliases:
          - bio-worker

networks:
  blog_net:
    external: true

volumes:
  bioplatform-uploads:
    name: bioplatform-uploads
  bio-worker-tasks:
    name: bio-worker-tasks
